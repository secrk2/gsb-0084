services:
  postgres:
    image: postgres:16-alpine
    container_name: jimu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jimu
      POSTGRES_PASSWORD: jimu
      POSTGRES_DB: jimu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jimu -d jimu"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: jimu-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    container_name: jimu-backend
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://jimu:jimu@postgres:5432/jimu
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /data/uploads
      CACHE_TTL: "30"
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "3000"

  frontend:
    build: ./frontend
    container_name: jimu-frontend
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  uploads:
